<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Demo AI Chatbot</title>

<style>

body{
    margin:0;
    padding:0;
    background:#f4f4f4;
    font-family:Arial, Helvetica, sans-serif;
}

.container{
    width:450px;
    margin:40px auto;
    background:white;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
    overflow:hidden;
}

.header{
    background:#007bff;
    color:white;
    text-align:center;
    padding:15px;
    font-size:22px;
    font-weight:bold;
}

.chat-box{
    height:450px;
    overflow-y:auto;
    padding:15px;
    background:#fafafa;
}

.user{
    text-align:right;
    margin:10px 0;
}

.bot{
    text-align:left;
    margin:10px 0;
}

.user span{
    background:#007bff;
    color:white;
    padding:10px;
    border-radius:10px;
    display:inline-block;
}

.bot span{
    background:#e5e5e5;
    padding:10px;
    border-radius:10px;
    display:inline-block;
}

.input-box{
    display:flex;
    border-top:1px solid #ddd;
}

input{
    flex:1;
    border:none;
    padding:15px;
    font-size:16px;
}

input:focus{
    outline:none;
}

button{
    width:100px;
    border:none;
    background:#007bff;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
🤖 My AI Chatbot
</div>

<div id="chat" class="chat-box">

<div class="bot">
<span>What You want know, I am here for just Hi hello!.</span>
</div>

</div>

<div class="input-box">

<input
id="msg"
type="text"
placeholder="Type your message..."
onkeypress="if(event.key==='Enter')send()">

<button onclick="send()">Send</button>

</div>

</div>

<script>

function send(){

let message=document.getElementById("msg").value;

if(message=="") return;

let chat=document.getElementById("chat");

chat.innerHTML+=`
<div class="user">
<span>${message}</span>
</div>
`;

fetch("/chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
message:message
})

})
.then(res=>res.json())
.then(data=>{

chat.innerHTML+=`
<div class="bot">
<span>${data.response}</span>
</div>
`;

chat.scrollTop=chat.scrollHeight;

});

document.getElementById("msg").value="";

}

</script>

</body>
</html>
